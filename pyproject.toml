[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fandom-cli"
version = "0.1.0"
description = "Query any Fandom wiki via MediaWiki API — agent-friendly CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Jiaxin Kou", email = "koujiaxin@neta.art"},
]
keywords = ["fandom", "wiki", "mediawiki", "cli", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
fandom = "fandom_cli.cli:main"

[project.urls]
Homepage = "https://github.com/kjx-talesofai/fandom-cli"
Repository = "https://github.com/kjx-talesofai/fandom-cli"

[tool.hatch.build.targets.wheel]
packages = ["fandom_cli"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
